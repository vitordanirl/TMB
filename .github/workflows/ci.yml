name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET) · build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Orders.slnx

      - name: Build (warnings como erro)
        run: dotnet build Orders.slnx --no-restore --configuration Release

      # Testes de integração usam Testcontainers (PostgreSQL e RabbitMQ reais);
      # o Docker já vem disponível nos runners ubuntu-latest.
      - name: Testes (unitários, integração e golden)
        run: >
          dotnet test Orders.slnx --no-build --configuration Release
          --logger "trx" --results-directory TestResults

      - name: Publicar resultados e snapshots divergentes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            TestResults/
            tests/**/*.received.*

  frontend:
    name: Frontend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta · docker compose
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Subir o ambiente completo
        run: docker compose --env-file .env.example up -d --build

      - name: Teste de fumaça
        run: ./scripts/smoke-test.sh

      - name: Logs dos serviços
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Derrubar o ambiente
        if: always()
        run: docker compose --env-file .env.example down -v
