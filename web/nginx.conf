# Serve a SPA e encaminha a API e o hub de tempo real para o backend,
# mantendo tudo na mesma origem (sem CORS no navegador).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream orders_api {
  server api:8080;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # /api/orders → http://api:8080/orders
  location /api/ {
    proxy_pass http://orders_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SignalR (WebSocket com fallback para SSE/long polling)
  location /hubs/ {
    proxy_pass http://orders_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Assets com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rotas da SPA: qualquer caminho desconhecido devolve o index.html (sem cache).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
