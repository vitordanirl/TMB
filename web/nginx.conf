# Serve a SPA e encaminha a API e o hub de tempo real para o backend,
# mantendo tudo na mesma origem (sem CORS no navegador).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # DNS interno do Docker. Com o upstream em variável, o nginx resolve "api" em tempo de
  # requisição (cache de 10 s) em vez de só no boot — assim um container da API recriado,
  # com outro IP, continua acessível sem reiniciar o nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # Falha rápido se a API estiver fora (padrão do nginx: 60 s), para o frontend cair no
  # fallback/reconexão em vez de ficar preso numa requisição pendurada.
  proxy_connect_timeout 3s;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # /api/orders → http://api:8080/orders
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Respostas da IA podem levar dezenas de segundos (várias consultas ao modelo).
    proxy_read_timeout 120s;
  }

  # SignalR (WebSocket com fallback para SSE/long polling)
  location /hubs/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Assets com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rotas da SPA: qualquer caminho desconhecido devolve o index.html (sem cache).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
